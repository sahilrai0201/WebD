<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form>
        <fieldset>
            <legend>Sign In</legend>
            <label for="Email">Email ID:</label>
            <input type="text" id="Email" placeholder="Enter your email">
            <br><br>

            <label for="Passkey">Passkey:</label>
            <input type="text" id="Passkey" placeholder="Enter your password">
            <br><br>

            <input type="Submit" value="Submit">
            <!-- <button>Click here</button> -->
        </fieldset>
    </form>
    <br><br><br>

    <form>
        <fieldset>
            <legend>HTML dummy form</legend>
            <label for="datePicker">Choose Date:</label>
            <input type="date" id="datePicker">
            <br><br>

            <label for="selector1">Choose Dish:</label>
            <select name="Dishes" id="selector1">
                <option value="maggie">Maggie</option>
                <option value="kurkure">Kurkure</option>
                <option value="chips">Chips</option>
            </select>
            <br><br>

            <button>Main hu button</button>
            <br><br>

            <textarea name="textArea1" id="textArea1" cols="50" rows="10" placeholder="Enter text here..."></textarea>
            <br><br>
        </fieldset>
    </form>
    <br><br><br>

    <form>
        <fieldset>
            <legend>Input Types</legend>
            <label for="textfield1">Text Field:</label>
            <input type="text" name="textfield1" id ="textfield1" placeholder="type here...">
            <br><br>

            <label for="button1">Button:</label>
            <input type="submit" name="button1" id="button1" value="Subscribe">
            <br><br>

            <label for="radio1">Male:</label>
            <input type="radio" name="radio1" id="radio1">
            <label for="radio2">Female:</label>
            <input type="radio" name="radio2" id="radio2">
            <br><br>

            <label for="checkbox1">English:</label>
            <input type="checkbox" name="checkbox1" id="checkbox1">
            <label for="checkbox2">Hindi:</label>
            <input type="checkbox" name="checkbox2" id="checkbox2">
            <br><br>

            <label for="fileSelect">Upload File:</label>
            <input type="file" name="fileSelect" id="fileSelect">
            <br><br>

            <input type="image" name="button1" id="button1" 
                   src="https://via.placeholder.com/100" alt="Click here" width="10" height="10">
            <br><br>

            <label for="password1">Password:</label>
            <input type="password" name="password1" id="password1" placeholder="Enter your password">
            <br><br>

            <label for="date1">Enter Date:</label>
            <input type="date" name="date1" id="date1">
            <br><br>
        </fieldset>
    </form>

</body>
</html>
