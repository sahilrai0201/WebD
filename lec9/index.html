<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Example Form 1</legend>
            <h2>Event Registration</h2>
            
            <label for="fullname">Name: </label> <br>
            <input type="text" name="fullname" placeholder="Enter your full name" required> <br><br>

            <label for="email">Email: </label> <br>
            <input type="email" name="email" required> <br><br>

            <label for="phone">Phone: </label> <br>
            <input type="tel" name="phone" required> <br><br>

            <label for="occupation">Occupation: </label> <br>
            <select name="occupation" id="occupation">
                <option value="others">Others</option>
                <option value="teacher">Teacher</option>
                <option value="engineer">Engineer</option>
                <option value="student">Student</option>
                <option value="doctor">Doctor</option>
            </select> <br><br>

            <span>Topic of Interest:</span>
            <!-- <label for="text1">Topic of Interest:</label> <br> -->
            <!-- <input type="text" id="text1"> -->
            <input type="checkbox" name="checkbox1" value="checkbox1">
            <label for="checkbox1">HTML</label> <br>
            <input type="checkbox" name="checkbox2" value="checkbox2">
            <label for="checkbox2">CSS</label> <br>
            <input type="checkbox" name="checkbox3" value="checkbox3"> 
            <label for="checkbox3">JavaScript</label>
            <br><br>
            
            <label for="textfield1">Comment:</label><br>
            <input type="text" id="textfield1" name="textfield1" cols="50" rows="10" placeholder="Enter your comment here"> 
            <br><br>
        </fieldset>
    </form>
    <br><br><br>

    <form>
        <fieldset>
            <legend>Personal Information</legend>

            <label for="name">Name:</label>
            <input type="text" id="name" name="name"> <br><br>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email"> <br><br>
            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone"><br><br>

            <label for="dob">Date of Birth:</label>
            <input type="date" id="dob" name="dob"><br><br>
            <span>Gender:</span> <br>
            <label for="radio1">Male</label>
            <input type="radio" id="radio1" name="radiobutton">
            <label for="radio2">Female</label>
            <input type="radio" id="radio2" name="radiobutton"><br><br>
            
            <label for="countryName">Country</label>
            <select name="countryName" id="countryName">
                <option value="us">USA</option>
                <option value="uk">UK</option>
                <option value="ca">Canada</option>
                <option value="india">India</option>
            </select> <br><br>

            <span>Address: </span> <br>
            <label for="street">Street</label>
            <input type="text" id="street" name="street">
            <label for="city">City</label>
            <input type="text" id="city" name="city">
            <label for="state">State</label>
            <input type="text" id="state" name="state"> <br><br>

            <label for="file1">Upload Resume:</label>
            <input type="file" name="file1" id="file1"> <br><br>

            <label for="counter">Experiance(yrs)</label>
            <input type="number" id="counter" name="counter" min="1" max="10" value="1"> <br><br>

            <label for="textarea1">Comments</label>
            <input type="text" id="textarea1" name="textarea1" cols="50" rows="10"> <br> <br>

            <input type="checkbox" name="checkbox" id="checkbox">
            <label for="checkbox">I agree to the terms and conditions</label>
            <br><br>

            <input type="button" value="Submit"><br>
        </fieldset>
    </form>

</body>
</html>
