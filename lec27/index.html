<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      .container {
        width: 100vw;
        height: 100vh;

        border: 2px solid black;
        background-color: #8bc6ec;
        background-image: linear-gradient(135deg, #8bc6ec 0%, #9599e2 100%);

        display: flex;
        justify-content: center;
        align-items: center;
        /* flex-direction: column; */
      }

      .box {
        border: 2px solid black;
        background-color: white;
        height: 80%;
        width: 25%;
        margin: 20px;
        padding: 20px;
        border-radius: 20px;

        display: flex;
        justify-content: center;
        align-items: center;
        gap: 17px;
        flex-direction: column;
      }

      .box img {
        height: 66%;
        margin: 2px;
        border-radius: 20px;
        padding: 2px;
      }

      .box h2 {
        font-size: 30px;
        color: black;
        margin: 2px;
        padding: 2px;
      }

      #para {
        font-size: 18px;
        color: black;
        margin: 2px;
        padding: 2px;
      }
    </style>
  </head>
  <body>
    <div class="container">
        
      <div class="box">
        <img src="QR.jpg" />

        <h2>Improve your front end skills by building projects</h2>

        <p id="para">
          Scan the QR Code to visit Front End mentor and take your coding skills
          to next level
        </p>

      </div>

    </div>

  </body>
</html>
